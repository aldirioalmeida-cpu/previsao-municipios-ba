name: Atualizar previsão

on:
  schedule:
    # O agendamento do GitHub não tem horário garantido (atrasa ou pula rodadas).
    # Por isso o robô tenta TODA HORA, no minuto 17, e só atualiza se a previsão publicada
    # tiver 5 h 30 min ou mais. Rodadas extras terminam em segundos, sem baixar nada.
    - cron: "17 * * * *"
  workflow_dispatch: {}   # rodada manual pela aba Actions: sempre atualiza

permissions:
  contents: write

concurrency:
  group: atualizar-previsao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se precisa atualizar
        id: verifica
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "rodar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          try:
              g = json.load(open("previsao.json", encoding="utf-8"))["gerado_em"]
              idade = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(g)).total_seconds() / 3600
          except Exception:
              idade = 99
          print("rodar=" + ("true" if idade >= 5.5 else "false"))
          EOF
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.verifica.outputs.rodar == 'true'
        with:
          python-version: "3.12"

      - name: Gerar previsao.json
        if: steps.verifica.outputs.rodar == 'true'
        run: python gerar_previsao.py

      - name: Gerar iuv.json
        if: steps.verifica.outputs.rodar == 'true'
        continue-on-error: true   # se o IUV falhar, a previsão do tempo é publicada mesmo assim
        run: python gerar_iuv.py

      # Só para a tabela de extremos (maior/menor pixel do ECMWF e do GFS por município).
      # Os cards de previsão usam apenas o previsao.json (Open-Meteo) e não dependem desta etapa:
      # se ela falhar ou passar de 15 min, a previsão é publicada normalmente e fica o extremos.json anterior.
      - name: Gerar extremos.json (ECMWF e GFS por município, direto da grade dos modelos)
        if: steps.verifica.outputs.rodar == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install numpy matplotlib eccodes
          python extremos/gerar_extremos.py --saida extremos.tmp.json && mv extremos.tmp.json extremos.json

      - name: Publicar no repositório
        if: steps.verifica.outputs.rodar == 'true'
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previsao.json
          if [ -f iuv.json ]; then git add iuv.json; fi
          if [ -f extremos.json ]; then git add extremos.json; fi
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Previsão atualizada em $(TZ=America/Bahia date '+%d/%m/%Y %H:%M')"
            git pull --rebase -q || true
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Limpar cache do jsDelivr
        if: steps.commit.outputs.mudou == 'true'
        # Duas limpezas: logo após o push o jsDelivr ainda pode apontar para a versão anterior do ramo
        # e guardá-la de novo; a segunda, 2 min depois, garante a versão nova.
        run: |
          for espera in 20 120; do
            sleep $espera
            for f in previsao.json iuv.json extremos.json; do
              curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || echo "Aviso: purge de $f falhou; o jsDelivr atualiza sozinho em até 12 h."
            done
          done
