name: Atualizar previsão

on:
  schedule:
    # Horários em UTC (Bahia = UTC-3). Minuto 17 de propósito: na hora cheia o GitHub atrasa ou descarta rodadas:
    #   05:17 UTC = 02:17 na Bahia
    #   11:17 UTC = 08:17 na Bahia
    #   17:17 UTC = 14:17 na Bahia
    #   23:17 UTC = 20:17 na Bahia
    - cron: "17 5 * * *"
    - cron: "17 11 * * *"
    - cron: "17 17 * * *"
    - cron: "17 23 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-previsao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar previsao.json
        run: python gerar_previsao.py

      - name: Gerar iuv.json
        continue-on-error: true   # se o IUV falhar, a previsão do tempo é publicada mesmo assim
        run: python gerar_iuv.py

      - name: Publicar no repositório
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previsao.json
          if [ -f iuv.json ]; then git add iuv.json; fi
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Previsão atualizada em $(TZ=America/Bahia date '+%d/%m/%Y %H:%M')"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Limpar cache do jsDelivr
        if: steps.commit.outputs.mudou == 'true'
        # Duas limpezas: logo após o push o jsDelivr ainda pode apontar para a versão anterior do ramo
        # e guardá-la de novo; a segunda, 2 min depois, garante a versão nova.
        run: |
          for espera in 20 120; do
            sleep $espera
            for f in previsao.json iuv.json; do
              curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || echo "Aviso: purge de $f falhou; o jsDelivr atualiza sozinho em até 12 h."
            done
          done
