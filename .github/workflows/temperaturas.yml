name: Temperaturas para graus-dia

# Guarda as temperaturas diárias (máx./mín.) dos municípios da Bahia em temp_ba.json para o cálculo de graus-dia
# do painel agrometeorológico (o site ba.gov.br não permite a página buscar na Open-Meteo diretamente).
# Roda uma vez por dia; a cada rodada também completa 90 dias de histórico até cobrir 400 dias.
on:
  schedule:
    - cron: "40 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: temperaturas
  cancel-in-progress: false

jobs:
  temperaturas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A série fica no ramo "temperaturas", recriado a cada rodada com um único commit (sem histórico acumulado:
      # as versões antigas são descartadas pelo GitHub e o repositório não cresce).
      - name: Recuperar a série anterior
        run: |
          if git fetch -q --depth=1 origin temperaturas; then
            git show FETCH_HEAD:temp_ba.json > temp_ba.json || rm -f temp_ba.json
          elif [ -f temp_ba.json ]; then
            echo "Usando a cópia antiga do ramo main."
          fi

      - name: Gerar temp_ba.json
        run: python agro/gerar_temp.py

      - name: Publicar no ramo temperaturas (substitui o anterior)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp temp_ba.json /tmp/temp_ba.json
          git checkout -q --orphan publica
          git rm -rq --cached .
          cp /tmp/temp_ba.json temp_ba.json
          git add -f temp_ba.json
          git commit -qm "Temperaturas para graus-dia em $(TZ=America/Bahia date '+%d/%m/%Y %H:%M')"
          git push -f origin publica:temperaturas

      - name: Limpar cache do jsDelivr
        run: |
          for espera in 20 120; do
            sleep $espera
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@temperaturas/temp_ba.json" || echo "purge falhou"
          done
