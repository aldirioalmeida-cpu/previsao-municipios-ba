name: Risco de incendio

# Risco de incêndio em vegetação por município (índices FWI e FMA+, calibrados com os focos do INPE desde 2003).
# Todo dia às 08:20 UTC (05:20 na Bahia): reanálise recente (NASA POWER) + previsão de 7 dias (Open-Meteo) -> risco/risco.json.
# Todo dia 5 do mês (ou ao rodar com "recalibrar"): refaz a calibração com o histórico desde 2003 -> risco/calibracao.json.
on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:
    inputs:
      recalibrar:
        description: "Refazer a calibração com o histórico desde 2003 (demora ~20 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: risco
  cancel-in-progress: false

jobs:
  risco:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install --quiet "numpy<3"
      - name: Calibrar (sob demanda, no dia 5 de cada mês ou se ainda não existir calibração)
        env:
          PEDIDO: ${{ inputs.recalibrar }}
        run: |
          if [ "$PEDIDO" = "true" ] || [ ! -f risco/calibracao.json ] || [ "$(date -u +%d)" = "05" -a "${{ github.event_name }}" = "schedule" ]; then
            python risco/gerar_risco.py --calibrar
          else
            echo "calibração existente mantida"
          fi
      - name: Gerar risco/risco.json
        run: python risco/gerar_risco.py
      - name: Publicar no repositório
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risco/risco.json risco/calibracao.json
          if git diff --cached --quiet; then echo "mudou=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Risco de incêndio atualizado em $(TZ=America/Bahia date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          echo "mudou=true" >> "$GITHUB_OUTPUT"
      - name: Limpar cache do jsDelivr
        if: steps.commit.outputs.mudou == 'true'
        run: |
          for espera in 20 120; do
            sleep $espera
            for f in risco/risco.json risco/calibracao.json; do
              curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" > /dev/null || echo "purge falhou: $f"
            done
          done
