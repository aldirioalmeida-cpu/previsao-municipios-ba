name: Mapas dos modelos

# Gera os mapas ECMWF x GFS x ICON da Bahia e publica no ramo "mapas".
# Toda hora (minuto 13) o robô confere se já saiu uma rodada 00Z ou 12Z mais nova que a publicada,
# completa nos três modelos (mapas/rodada_nova.py, leva segundos). Se saiu, gera os mapas na hora;
# na prática, 2 vezes por dia, logo que cada rodada fica pronta (~06–07h e ~18–19h, horário da Bahia).
# O disparador externo (Google Apps Script) também chama este robô; o disparo manual faz a mesma conferência,
# a não ser que se marque "forcar".
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Gerar os mapas mesmo sem rodada nova"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mapas-modelos
  cancel-in-progress: false

jobs:
  mapas:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se saiu rodada nova
        id: verifica
        run: |
          if [ "${{ inputs.forcar }}" = "true" ]; then echo "rodar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 mapas/rodada_nova.py >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.verifica.outputs.rodar == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mapas/requirements.txt

      - name: Instalar bibliotecas
        if: steps.verifica.outputs.rodar == 'true'
        run: pip install -r mapas/requirements.txt

      - name: Cache dos contornos (Natural Earth)
        if: steps.verifica.outputs.rodar == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-naturalearth-v1

      - name: Gerar mapas
        if: steps.verifica.outputs.rodar == 'true'
        run: python mapas/gerar_mapas.py --saida saida

      - name: Publicar no ramo mapas (substitui a versão anterior, sem acumular histórico)
        if: steps.verifica.outputs.rodar == 'true'
        run: |
          cd saida
          git init -q
          git checkout -q -b mapas
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mapas $(TZ=America/Bahia date '+%d/%m/%Y %H:%M')"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mapas

      - name: Limpar cache do jsDelivr
        if: steps.verifica.outputs.rodar == 'true'
        # Duas limpezas: logo após publicar o jsDelivr ainda pode apontar para a versão anterior do ramo
        # e guardá-la de novo; a segunda, 2 min depois, garante a versão nova.
        run: |
          for espera in 15 120; do
            sleep $espera
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@mapas/info.json" || echo "purge falhou; o jsDelivr atualiza sozinho em até 12 h."
          done
