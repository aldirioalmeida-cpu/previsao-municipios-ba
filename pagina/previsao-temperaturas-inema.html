    "<a href='/inema/meteorologia/modelos'>Mapas dos modelos</a><a href='/inema/meteorologia/satelite'>Satélite</a></div>" +
    "<div class='ip-meta' id='ip-meta'></div>" +
    "<div class='ip-status' id='ip-status'>Buscando dados…</div>" +
    "<div id='ip-conteudo' hidden>" +
      "<h3>Extremos previstos</h3>" +
      "<div class='ip-rot'>Dia</div>" +
      "<div class='ip-dias' id='ip-dias' role='group' aria-label='Dia da previsão'></div>" +
      "<div class='ip-rot'>Regiões climáticas <span id='ip-reg-info'></span></div>" +
      "<div class='ip-dias ip-regs' id='ip-regs' role='group' aria-label='Filtrar extremos por região climática'></div>" +
      "<div class='ip-rot'>Modelo dos extremos <span>(compare ECMWF × GFS × ICON)</span></div>" +
      "<div class='ip-dias ip-mods' id='ip-mods' role='group' aria-label='Modelo usado nas listas de extremos'></div>" +
      "<div class='ip-cards'>" +
        cardLista("f", "Menores mínimas (°C)", "ip-l-min") +
        cardLista("q", "Maiores máximas (°C)", "ip-l-max") +
        cardLista("u", "Menores umidades relativas (%)", "ip-l-ur") +
        cardLista("c", "Maiores volumes de chuva (mm)", "ip-l-mm") +
        cardLista("w", "Maiores ventos médios (km/h)", "ip-l-v") +
        cardLista("v", "Maiores rajadas (km/h)", "ip-l-raj") +
      "</div>" +
      "<h3>Previsão de temperaturas (°C) por cidades</h3>" +
      "<div class='ip-ferr'>" +
        "<label><input type='checkbox' id='ip-todos'> Mostrar todos os municípios</label>" +
        "<input type='search' id='ip-busca' placeholder='Buscar município…' aria-label='Buscar município' hidden>" +
        "<button type='button' id='ip-xls'>Baixar planilha (XLS)</button>" +
        "<span class='ip-cont' id='ip-cont'></span>" +
      "</div>" +
      "<div class='ip-tab-wrap'>" + TB + " id='ip-tab'><thead></thead><tbody></tbody></table></div>" +
      "<p class='ip-nota'>Clique no cabeçalho de uma coluna para ordenar. Valores em negrito: estão entre as 10 maiores máximas ou as 10 menores mínimas do estado naquele dia. " +
      "A tabela e a planilha usam a previsão do ECMWF no ponto da sede (Open-Meteo). As listas de extremos usam, para cada município (malha IBGE 2024), " +
      "o maior valor (máxima, chuva, rajada, vento) ou o menor (mínima, umidade) entre os pixels do modelo (0,25°, ~28 km) que tocam o município — o extremo dentro do município.</p>" +
    "</div>";

  var $ = function (id) { return document.getElementById(id); };
  var DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  var dados, nomes, datas, diaSel = 0, ordem = { col: null, asc: true }, destaque = {};

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function sa(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function dt(iso) { var p = iso.split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
  function rotDia(iso) { var d = dt(iso); return DIAS[d.getDay()] + " " + ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2); }
  function num(v, casas) { return v == null ? "–" : (casas ? v.toFixed(casas).replace(".", ",") : String(Math.round(v))); }
  // Fonte dos valores: extremos.json (máx/mín/chuva... calculados na grade do modelo, por município).
  // Tabela e planilha usam sempre o ECMWF; as listas de extremos usam o modelo escolhido (ECMWF, GFS ou ICON).
  // Sem extremos.json, volta para os valores do previsao.json.
  var EXT = null, modExt = "ecmwf";
  try { var mx = localStorage.getItem("inemaPrevModelo"); if (mx === "gfs" || mx === "icon") modExt = mx; } catch (e) {}
  function fonte(mod) { return EXT && EXT.modelos && EXT.modelos[mod] ? EXT.modelos[mod].municipios : dados.municipios; }
  function valM(mod, m, campo, i) { if (mod === "sede") return val(m, campo, i); var M = fonte(mod)[m], l = M && M[campo]; return l && i < l.length ? l[i] : null; }
  // Tabela das 21 cidades e planilha: valores da sede (previsao.json / Open-Meteo), como nos cards.
  function val(m, campo, i) { var l = dados.municipios[m] && dados.municipios[m][campo]; var k = dados.datas.indexOf(datas[i]); return l && k >= 0 && k < l.length ? l[k] : null; }
  function rodadaTxt(r) { var x = (r || "").match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d)Z$/); return x ? x[3] + "/" + x[2] + " " + x[4] + " UTC" : "–"; }
  function regiao(m) { return LOCAL[m] ? REGIOES[LOCAL[m][0]] : "–"; }
  function territorio(m) { return LOCAL[m] ? TERRITORIOS[LOCAL[m][1]] : "–"; }

  // filtroReg: true = aplica as regiões selecionadas (listas de extremos); false = estado inteiro (negrito da tabela)
  // completo: true = ranking inteiro (usado na busca de município dentro de cada card)
  function ranking(campo, i, crescente, filtroReg, mod, completo) {
    mod = mod || "ecmwf";
    var r = nomes.filter(function (m) { return valM(mod, m, campo, i) != null && (!filtroReg || naSelecao(m)); })
      .sort(function (a, b) { var d = valM(mod, a, campo, i) - valM(mod, b, campo, i); return (crescente ? d : -d) || a.localeCompare(b, "pt"); });
    return completo ? r : r.slice(0, N);
  }
  function desenhaModelos() {
    var el = $("ip-mods"); if (!el) return;
    var M = (EXT && EXT.modelos) || {};
    el.innerHTML = [["ecmwf", "ECMWF"], ["gfs", "GFS"], ["icon", "ICON"]].map(function (x) {
      var ok = !!M[x[0]];
      return "<button type='button' data-m='" + x[0] + "' aria-pressed='" + (modExt === x[0]) + "'" + (ok ? "" : " disabled") + ">" + x[1] +
        (ok ? (M[x[0]].rodada ? " <small>· rodada " + rodadaTxt(M[x[0]].rodada) + "</small>" : "") : " <small>· indisponível</small>") + "</button>";
    }).join("");
  }

  // Regiões selecionadas no filtro (vazio = todas). Fica guardado no navegador de cada usuário.
  var regSel = {};
  try { (JSON.parse(localStorage.getItem("inemaPrevRegioes") || "[]")).forEach(function (r) { regSel[r] = 1; }); } catch (e) {}
  function nenhumaReg() { for (var k in regSel) return false; return true; }
  function naSelecao(m) { return nenhumaReg() || (LOCAL[m] && regSel[LOCAL[m][0]]); }
  function desenhaRegioes() {
    var todas = nenhumaReg();
    $("ip-regs").innerHTML = "<button type='button' data-r='todas' aria-pressed='" + todas + "'>Todas</button>" +
      REGIOES.map(function (r, k) { return "<button type='button' data-r='" + k + "' aria-pressed='" + !!regSel[k] + "'>" + esc(r) + "</button>"; }).join("");
    var n = Object.keys(regSel).length;
    $("ip-reg-info").textContent = todas ? "(mostrando o estado todo)" : "(" + n + " selecionada" + (n > 1 ? "s" : "") + ")";
  }

  function lista(id, campo, crescente, casas) {
    var mod = EXT && EXT.modelos && EXT.modelos[modExt] ? modExt : "ecmwf";
    var val = function (m, c, i) { return valM(mod, m, c, i); };
    var r = ranking(campo, diaSel, crescente, true, mod);
    if (campo === "mm") r = r.filter(function (m) { return val(m, "mm", diaSel) > 0; });
    $(id).innerHTML = r.length ? r.map(function (m, k) {
      var loc = regiao(m) + " · TI " + territorio(m);
      return "<li><span class='pos'>" + (k + 1) + "º</span><span class='mun'><span title='" + esc(m) + "'>" + esc(m) + "</span>" +
        "<span class='loc' title='Região climática · Território de Identidade: " + esc(loc) + "'>" + esc(loc) + "</span></span>" +
        "<span class='val'>" + num(val(m, campo, diaSel), casas) + "</span></li>";
    }).join("") : "<li class='vazio'>" + (campo === "mm" ? "Sem chuva prevista neste dia." : "Sem dados.") + "</li>";
    buscaLista(id, campo, crescente, casas);
  }

  // Busca de município dentro do card: mostra a posição no ranking completo (respeitando o filtro de regiões).
  function buscaLista(id, campo, crescente, casas) {
    var inp = document.querySelector("#inema-prev input[data-l='" + id + "']"), res = $(id.replace("ip-l-", "ip-r-"));
    if (!inp || !res) return;
    var q = sa(inp.value.trim());
    if (q.length < 2) { res.innerHTML = ""; res.hidden = true; return; }
    var mod = EXT && EXT.modelos && EXT.modelos[modExt] ? modExt : "ecmwf";
    var todos = ranking(campo, diaSel, crescente, true, mod, true);
    var achados = nomes.filter(function (m) { return sa(m).indexOf(q) >= 0; })
      .sort(function (a, b) { return (sa(a).indexOf(q) === 0 ? 0 : 1) - (sa(b).indexOf(q) === 0 ? 0 : 1) || a.localeCompare(b, "pt"); })
      .slice(0, 5);
    res.hidden = false;
    res.innerHTML = achados.length ? achados.map(function (m) {
      var p = todos.indexOf(m), v = valM(mod, m, campo, diaSel);
      var loc = regiao(m) + " · TI " + territorio(m) + (p < 0 && v != null ? " · fora das regiões selecionadas" : "");
      return "<li><span class='pos'>" + (p >= 0 ? (p + 1) + "º" : "–") + "</span><span class='mun'><span title='" + esc(m) + "'>" + esc(m) + "</span>" +
        "<span class='loc'>" + esc(loc) + (p >= 0 ? " · de " + todos.length : "") + "</span></span>" +
        "<span class='val'>" + num(v, casas) + "</span></li>";
    }).join("") : "<li class='vazio'>Nenhum município encontrado.</li>";
  }

  function desenhaExtremos() {
    lista("ip-l-max", "max", false); lista("ip-l-min", "min", true);
    lista("ip-l-ur", "urmin", true); lista("ip-l-mm", "mm", false, 1);
    lista("ip-l-raj", "raj", false); lista("ip-l-v", "v", false);
    Array.prototype.forEach.call($("ip-dias").children, function (b, i) { b.setAttribute("aria-pressed", i === diaSel); });
  }

  function cabecalho() {
    var h1 = "<tr>" + TH + " class='mun' rowspan='2' data-col='mun'>Município</th>", h2 = "<tr>";
    datas.forEach(function (d, i) {
      h1 += TH + " colspan='2'>" + rotDia(d) + "</th>";
      h2 += TH + " data-col='min" + i + "'>Mín</th>" + TH + " data-col='max" + i + "'>Máx</th>";
    });
    $("ip-tab").tHead.innerHTML = h1 + "</tr>" + h2 + "</tr>";
  }

  function desenhaTabela() {
    var todos = $("ip-todos").checked;
    $("ip-busca").hidden = !todos;
    var q = todos ? sa($("ip-busca").value.trim()) : "";
    var base = todos ? nomes : CIDADES.filter(function (m) { return dados.municipios[m]; });
    var lst = base.filter(function (m) { return !q || sa(m).indexOf(q) >= 0; });
    if (ordem.col === "mun") {
      lst.sort(function (a, b) { return ordem.asc ? a.localeCompare(b, "pt") : b.localeCompare(a, "pt"); });
    } else if (ordem.col) {
      var campo = ordem.col.slice(0, 3), i = +ordem.col.slice(3);
      lst.sort(function (a, b) {
        var va = val(a, campo, i), vb = val(b, campo, i);
        if (va == null) return 1; if (vb == null) return -1;
        return (ordem.asc ? va - vb : vb - va) || a.localeCompare(b, "pt");
      });
    }
    $("ip-tab").tBodies[0].innerHTML = lst.map(function (m) {
      var tr = "<tr>" + TD + " class='mun'>" + esc(m) + "</td>";
      datas.forEach(function (d, i) {
        tr += TD + " class='tmin dia1" + (destaque["min" + i][m] ? " dest" : "") + "'>" + num(val(m, "min", i)) + "</td>" +
              TD + " class='tmax" + (destaque["max" + i][m] ? " dest" : "") + "'>" + num(val(m, "max", i)) + "</td>";
      });
      return tr + "</tr>";
    }).join("");
    var falta = todos ? [] : CIDADES.filter(function (m) { return !dados.municipios[m]; });
    $("ip-cont").textContent = todos ? lst.length + " de " + nomes.length + " municípios"
      : lst.length + " cidades" + (falta.length ? " · não encontrada(s): " + falta.join(", ") : "");
    Array.prototype.forEach.call($("ip-tab").querySelectorAll("[data-col]"), function (th) {
      th.classList.toggle("ord", th.getAttribute("data-col") === ordem.col);
      th.classList.toggle("asc", th.getAttribute("data-col") === ordem.col && ordem.asc);
    });
  }

  // Planilha .xls no mesmo formato do boletim: Cidades | data (Tmín, Tmáx) | data (Tmín, Tmáx) ...
  // Assim o bloco de números pode ser copiado e colado direto na tabela do boletim.
  // Usa a biblioteca SheetJS (carregada só no clique, do cdn.jsdelivr.net, já liberado no site).
  var libXlsx = null;
  function carregaXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!libXlsx) libXlsx = new Promise(function (ok, erro) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
      s.onload = function () { window.XLSX ? ok(window.XLSX) : erro(new Error("biblioteca não carregou")); };
      s.onerror = function () { libXlsx = null; erro(new Error("biblioteca não carregou")); };
      document.head.appendChild(s);
    });
    return libXlsx;
  }
  function aba(X, titulo, lista) {
    var r1 = [titulo], r2 = ["Cidades"], r3 = [""], merges = [{ s: { r: 0, c: 0 }, e: { r: 0, c: datas.length * 2 } }, { s: { r: 1, c: 0 }, e: { r: 2, c: 0 } }];
    datas.forEach(function (d, i) {
      r2.push(d.split("-").reverse().join("/"), ""); r3.push("Tmín", "Tmáx");
      merges.push({ s: { r: 1, c: 1 + 2 * i }, e: { r: 1, c: 2 + 2 * i } });
    });
    var linhas = [r1, r2, r3];
    lista.forEach(function (m) {
      var l = [m];
      datas.forEach(function (d, i) {
        var mi = val(m, "min", i), ma = val(m, "max", i);
        l.push(mi == null ? "" : Math.round(mi), ma == null ? "" : Math.round(ma));
      });
      linhas.push(l);
    });
    var ws = X.utils.aoa_to_sheet(linhas);
    ws["!merges"] = merges;
    ws["!cols"] = [{ wch: 26 }].concat(datas.map(function () { return [{ wch: 7 }, { wch: 7 }]; }).reduce(function (a, b) { return a.concat(b); }, []));
    return ws;
  }
  function baixarXls() {
    var bt = $("ip-xls"), txt = bt.textContent;
    bt.disabled = true; bt.textContent = "Gerando…";
    carregaXlsx().then(function (X) {
      var wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, aba(X, "Previsão de Temperaturas (em °C) por Cidades", CIDADES.filter(function (m) { return dados.municipios[m]; })), "Cidades");
      X.utils.book_append_sheet(wb, aba(X, "Previsão de Temperaturas (em °C) — todos os municípios", nomes), "Todos os municípios");
      X.writeFile(wb, "previsao-temperaturas-" + datas[0] + ".xls", { bookType: "biff8" });
    }).catch(function (e) {
      alert("Não foi possível gerar a planilha (" + e.message + "). Tente novamente.");
    }).then(function () { bt.disabled = false; bt.textContent = txt; });
  }

  function iniciar(j, ext) {
    dados = j;
    EXT = ext && ext.modelos && ext.modelos.ecmwf ? ext : null;
    datas = EXT ? EXT.datas : j.datas;
    nomes = Object.keys(j.municipios).sort(function (a, b) { return a.localeCompare(b, "pt"); });
    datas.forEach(function (d, i) {
      ["max", "min"].forEach(function (c) {
        destaque[c + i] = {};
        ranking(c, i, c === "min", false, "sede").forEach(function (m) { destaque[c + i][m] = 1; });
      });
    });
    var g = new Date((EXT || j).gerado_em || "");
    $("ip-meta").innerHTML = "Tabela: <b>ECMWF IFS 0,25° (Open-Meteo, na sede)</b>" +
      (EXT ? " · Extremos: <b>maior/menor valor da grade no município</b>, rodada <b>" + rodadaTxt(EXT.modelos.ecmwf.rodada) + "</b>" : "") +
      " · Gerado em <b>" + (!isNaN(g) ? g.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "–") +
      "</b> · " + nomes.length + " municípios · " + datas.length + " dias";
    if (!EXT || !EXT.modelos[modExt]) modExt = "ecmwf";
    desenhaModelos();
    $("ip-mods").onclick = function (e) {
      var b = e.target.closest("button"); if (!b || b.disabled) return;
      modExt = b.getAttribute("data-m");
      try { localStorage.setItem("inemaPrevModelo", modExt); } catch (e2) {}
      desenhaModelos(); desenhaExtremos();
    };
    var h = new Date(), hoje = h.getFullYear() + "-" + ("0" + (h.getMonth() + 1)).slice(-2) + "-" + ("0" + h.getDate()).slice(-2);
    diaSel = Math.max(0, datas.indexOf(hoje));
    $("ip-dias").innerHTML = datas.map(function (d, i) {
      return "<button type='button' data-i='" + i + "'>" + (d === hoje ? "Hoje · " : "") + rotDia(d) + "</button>";
    }).join("");
    $("ip-dias").onclick = function (e) { var b = e.target.closest("button"); if (b) { diaSel = +b.getAttribute("data-i"); desenhaExtremos(); } };
    $("ip-regs").onclick = function (e) {
      var b = e.target.closest("button"); if (!b) return;
      var r = b.getAttribute("data-r");
      if (r === "todas") regSel = {}; else if (regSel[r]) delete regSel[r]; else regSel[r] = 1;
      if (Object.keys(regSel).length === REGIOES.length) regSel = {};
      try { localStorage.setItem("inemaPrevRegioes", JSON.stringify(Object.keys(regSel))); } catch (e2) {}
      desenhaRegioes(); desenhaExtremos();
    };
    desenhaRegioes();
    $("ip-tab").tHead.onclick = function (e) {
      var th = e.target.closest("[data-col]"); if (!th) return;
      var c = th.getAttribute("data-col");
      ordem = ordem.col === c ? { col: c, asc: !ordem.asc } : { col: c, asc: c === "mun" || c.indexOf("min") === 0 };
      desenhaTabela();
    };
    $("ip-busca").oninput = desenhaTabela;
    // busca dentro dos cards de extremos (lista de nomes para o autocompletar)
    var dl = document.createElement("datalist"); dl.id = "ip-dl-mun";
    dl.innerHTML = nomes.slice().sort(function (a, b) { return a.localeCompare(b, "pt"); })
      .map(function (m) { return "<option value='" + esc(m) + "'>"; }).join("");
    raiz.appendChild(dl);
    raiz.querySelector(".ip-cards").addEventListener("input", function (e) {
      if (e.target.matches && e.target.matches("input[data-l]")) desenhaExtremos();
    });
    $("ip-todos").onchange = function () { ordem = { col: null, asc: true }; desenhaTabela(); };
    $("ip-xls").onclick = baixarXls;
    cabecalho(); desenhaExtremos(); desenhaTabela();
    $("ip-status").hidden = true; $("ip-conteudo").hidden = false;
  }

  var URL_EXT = URL_DADOS.replace("previsao.json", "extremos.json");
  Promise.all([
    fetch(URL_DADOS + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
    fetch(URL_EXT + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ])
    .then(function (r) { iniciar(r[0], r[1]); })
    .catch(function (e) {
      var s = $("ip-status"); s.className = "ip-status err";
      s.textContent = "Não foi possível carregar a previsão (" + e.message + "). Tente recarregar a página.";
    });
})();
</script>
