<div id="inema-prev">
  <style>
    #inema-prev{font-family:inherit;max-width:960px;margin:0 auto}
    #inema-prev .ip-busca{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    #inema-prev input{flex:1;min-width:220px;padding:10px 12px;font-size:16px;border:1px solid #9aa5b1;border-radius:6px}
    #inema-prev button{padding:10px 18px;font-size:16px;border:0;border-radius:6px;background:#00566e;color:#fff;cursor:pointer}
    #inema-prev button:hover{background:#00404f}
    #inema-prev button:disabled{background:#9aa5b1;cursor:wait}
    #inema-prev .ip-msg{margin:8px 0;color:#444}
    #inema-prev .ip-erro{color:#b00020}
    #inema-prev .ip-dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
    #inema-prev .ip-dia{border:1px solid #d5dbe1;border-radius:8px;padding:10px;text-align:center;background:#fff}
    #inema-prev .ip-dia b{display:block;text-transform:capitalize}
    #inema-prev .ip-ico{font-size:32px;line-height:1.3}
    #inema-prev .ip-max{color:#c0392b;font-weight:600}
    #inema-prev .ip-min{color:#1f6fb2;font-weight:600}
    #inema-prev .ip-chuva{font-size:13px;color:#333}
    #inema-prev .ip-fonte{font-size:12px;color:#666;margin-top:12px}
  </style>
  <form class="ip-busca" onsubmit="return false">
    <label for="ip-mun" style="width:100%;font-weight:600">Digite o nome do município da Bahia:</label>
    <input id="ip-mun" list="ip-lista" placeholder="Ex.: Feira de Santana" autocomplete="off">
    <datalist id="ip-lista"></datalist>
    <button type="submit" id="ip-btn" disabled>Carregando…</button>
  </form>
  <div class="ip-msg" id="ip-msg" aria-live="polite"></div>
  <div class="ip-dias" id="ip-dias"></div>
  <div class="ip-fonte" id="ip-fonte"></div>
  <script>
  (function () {
    /* ===== Configuração: endereço do previsao.json no GitHub via jsDelivr ===== */
    var URL_JSON = "https://cdn.jsdelivr.net/gh/aldirioalmeida-cpu/previsao-municipios-ba@main/previsao.json";

    var $ = function (id) { return document.getElementById(id); };
    var norm = function (s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); };
    var dados = null, indice = {};

    /* Texto do tempo = nuvens (cobertura média do dia, %) + chuva (código WMO) */
    var CHUVA = {45:"com nevoeiro",48:"com nevoeiro",
      51:"com chuva fraca",53:"com chuva fraca",55:"com chuva fraca",61:"com chuva fraca",
      63:"com chuva moderada",65:"com chuva forte",
      80:"com pancadas de chuva fracas",81:"com pancadas de chuva",82:"com pancadas de chuva fortes",
      95:"com trovoadas",96:"com trovoadas",99:"com trovoadas"};
    var NUVEM_POR_CODIGO = {0:10, 1:30, 2:55, 3:85};   /* usado só se faltar a cobertura de nuvens */

    function condicao(codigo, nuvem) {
      if (nuvem == null) nuvem = NUVEM_POR_CODIGO[codigo] != null ? NUVEM_POR_CODIGO[codigo] : 85;
      var ceu = nuvem <= 20 ? "Céu claro" : nuvem <= 40 ? "Poucas nuvens" : nuvem <= 70 ? "Parcialmente nublado" : "Nublado";
      var chuva = CHUVA[codigo] || "";
      var icone;
      if (codigo >= 95) icone = "⛈️";
      else if (codigo === 45 || codigo === 48) icone = "🌫️";
      else if (chuva) icone = nuvem > 70 ? "🌧️" : "🌦️";
      else icone = nuvem <= 20 ? "☀️" : nuvem <= 40 ? "🌤️" : nuvem <= 70 ? "⛅" : "☁️";
      return [icone, chuva ? ceu + " " + chuva : ceu];
    }

    function msg(t, erro) { $("ip-msg").innerHTML = t; $("ip-msg").className = "ip-msg" + (erro ? " ip-erro" : ""); }

    fetch(URL_JSON, { cache: "no-cache" })   /* sempre confere se há versão nova (o jsDelivr manda o navegador guardar por 7 dias) */
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        dados = j;
        var nomes = Object.keys(j.municipios).sort(function (a, b) { return a.localeCompare(b, "pt"); });
        nomes.forEach(function (n) { indice[norm(n)] = n; });
        $("ip-lista").innerHTML = nomes.map(function (n) { return '<option value="' + n + '">'; }).join("");
        $("ip-btn").disabled = false; $("ip-btn").textContent = "Ver previsão";
      })
      .catch(function () {
        $("ip-btn").textContent = "Indisponível";
        msg("A previsão por município está temporariamente indisponível. Tente novamente mais tarde.", true);
      });

    $("ip-btn").addEventListener("click", buscar);
    $("ip-mun").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); buscar(); } });

    function buscar() {
      if (!dados) return;
      var nome = indice[norm($("ip-mun").value || "")];
      $("ip-dias").innerHTML = ""; $("ip-fonte").innerHTML = "";
      if (!nome) { msg("Município não encontrado na Bahia. Escolha um nome da lista.", true); return; }
      var m = dados.municipios[nome], hoje = new Date().toLocaleDateString("sv-SE", { timeZone: "America/Bahia" }), html = "";
      for (var i = 0; i < dados.datas.length; i++) {
        if (dados.datas[i] < hoje || m.max[i] == null) continue;
        var data = new Date(dados.datas[i] + "T12:00:00");
        var rotulo = dados.datas[i] === hoje ? "Hoje" : data.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" });
        var t = condicao(m.c[i], m.n ? m.n[i] : null);
        var prob = m.p && m.p[i] != null ? m.p[i] + "% · " : "";
        html += '<div class="ip-dia"><b>' + rotulo + '</b><div class="ip-ico" title="' + t[1] + '">' + t[0] + '</div>' +
          '<div>' + t[1] + '</div>' +
          '<div><span class="ip-max">' + m.max[i] + '°</span> / <span class="ip-min">' + m.min[i] + '°</span></div>' +
          '<div class="ip-chuva">💧 ' + prob + (m.mm[i] || 0).toFixed(1) + ' mm</div></div>';
      }
      if (!html) { msg("Não há previsão disponível para " + nome + " no momento.", true); $("ip-dias").innerHTML = ""; return; }
      msg("<strong>" + nome + " – BA</strong>");
      $("ip-dias").innerHTML = html;
      var ger = new Date(dados.gerado_em);
      $("ip-fonte").innerHTML = "Previsão numérica do modelo " + dados.modelo + ", sem revisão de meteorologista. " +
        "Atualizada em " + ger.toLocaleString("pt-BR", { timeZone: "America/Bahia", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + ".";
    }
  })();
  </script>
</div>
